[project]
name = "sleeplab"
version = "2.0.6"
description = "Sleep therapy data analysis platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.3",
    "psycopg2-binary==2.9.13",
    "PyJWT==2.15.1",
    "passlib==1.7.4",
    "openai==3.24.0",
    "python-multipart==0.0.32",
    "httpx>=0.27.0",
    "matplotlib==3.11.2",
    "reportlab==5.0.1",
    "fastapi-mcp>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: tests that require a Postgres database",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
